<head>

<meta property="og:url" content="https://www.chemistr.io/">

<!--prerender:head:start--><!--prerender:head:end-->
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<link rel="stylesheet" href="/assets/css/site.css?v=7f31cd9f">
<script src="/assets/js/theme.js?v=f516d968"></script>
</head>
<body>

<div class="home-bg" aria-hidden="true">
  <canvas id="homeBgCanvas"></canvas>
</div>

<header class="site">
  <div class="wrap nav">
    <a class="brand" href="/">
      <span class="mark">chemistr.io</span>
    </a>
    <!-- Nav links, the page content below, and the viewer's notes are
         all filled in at build time by scripts/build-seo-pages.js, which
         rewrites whatever sits between each pair of prerender markers.
         app.js re-renders the same content on boot. -->
    <nav class="nav-links" id="navLinks"><!--prerender:nav:start--><a data-nav="home" href="/">Home</a><a data-nav="sims" href="/sims">Simulations</a><a data-nav="resources" href="/resources">Resources</a><a data-nav="about" href="/about">About</a><!--prerender:nav:end--></nav>
    <button class="menu-btn" onclick="toggleMenu()" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<main class="wrap">

  <!-- Ordinary content pages (home, simulations, resources, ...) live in
       pages/<id>.html and are mounted here. The build script inlines the
       current route's copy between the markers below so it's in the HTML
       a crawler receives; app.js fetches and mounts it for every later
       in-page navigation. See PAGES in assets/js/app.js. -->
  <div class="page active" id="pageMount"><!--prerender:page:start--><!--prerender:page:end--></div>

  <!-- SIMULATION VIEWER -->
  <section class="viewer" id="page-viewer">
    <div class="viewer-bar">
      <a class="back-link" href="/sims">&larr; Back to simulations</a>
      <h1 class="vtitle" id="viewerTitle"></h1>
      <button class="fullscreen-btn tour-btn" id="tourBtn" onclick="startSimTour()" style="display:none;">Walk me through</button>
      <button class="fullscreen-btn" id="fullscreenBtn" onclick="toggleFullscreen()">
        <svg id="fsIcon" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M1 5V1h4M9 1h4v4M13 9v4h-4M5 13H1V9"/>
        </svg>
        <span id="fsLabel">Full screen</span>
      </button>
    </div>
    <p class="vdesc" id="viewerDesc"></p>
    <div class="viewer-layout">
      <!-- app.js clears this and drops the simulation's iframe in. Until
           then it holds a plain link to the simulation's own page, which
           gives crawlers something to follow and anyone without JS a way
           through to the simulation itself. -->
      <div class="viewer-frame" id="viewerFrame"><!--prerender:frame:start--><!--prerender:frame:end--></div>
      <aside class="notes-sidebar" id="notesSidebar">
        <button class="notes-toggle" id="notesToggle" onclick="toggleNotes()" aria-expanded="false" aria-controls="notesContent">
          <span class="notes-toggle-arrow">&#9664;</span>
          <span class="notes-toggle-label">Teaching notes</span>
        </button>
        <div class="notes-body" id="notesBody">
          <div class="notes-content prose" id="notesContent"><!--prerender:notes:start--><!--prerender:notes:end--></div>
        </div>
      </aside>
    </div>
  </section>

</main>

<footer class="site">
  <div class="wrap">
    <span></span>
    <nav class="footer-links">
      <a href="/about#contact">Get in touch</a>
      <a href="/about#support">Donate</a>
      <a href="/about#privacy">Privacy</a>
      <a href="/about#license">License</a>
    </nav>
  </div>
</footer>

<script src="/assets/js/home-bg.js?v=c5e865e9"></script>
<script src="/assets/js/data.js?v=5a73c66c"></script>
<script src="/assets/js/render.js?v=633f905b"></script>
<script src="/assets/js/app.js?v=9586e3e4"></script>
</body>
</html>
